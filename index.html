<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Word Search</title>

<style>
:root{
 --tile:46px;
 --gap:10px;
 --border:#d9d9d9;
 --selected:#cfe8ff;
 --found:#bfe6c6;
 --primary:#bfe6c6;
 --secondary:#e7e7e7;
 --max:1100px;
}

body{
 margin:0;
 font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}

.wrap{
 max-width:var(--max);
 margin:0 auto;
 padding:28px 18px 40px;
}

h1{ margin:0 0 6px; font-size:44px; }
.sub{ margin:0 0 18px; color:#444; font-size:18px; }

.layout{
 display:flex;
 gap:26px;
 align-items:flex-start;
}

.grid{
 display:grid;
 gap:var(--gap);
 justify-content:center;
 user-select:none;
}

.tile{
 width:var(--tile);
 height:var(--tile);
 border:1px solid var(--border);
 border-radius:10px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:800;
 font-size:20px;
 cursor:pointer;
}

.tile.sel{ background:var(--selected); }
.tile.found{ background:var(--found); }

.side{ width:320px; }

.chips{
 display:flex;
 flex-wrap:wrap;
 gap:10px;
 margin-bottom:14px;
}

.chip{
 padding:10px 14px;
 border-radius:999px;
 border:1px solid #d0d0d0;
 font-weight:800;
 font-size:14px;
}

.chip.found{
 background:var(--found);
 border-color:transparent;
}

.controls{ display:flex; gap:12px; margin:12px 0; }

button{
 border:0;
 border-radius:10px;
 padding:12px 16px;
 font-weight:800;
 font-size:16px;
 cursor:pointer;
}

.primary{ background:var(--primary); }
.secondary{ background:#d7efe3; }

.status{ font-size:18px; font-weight:900; }

/* ===== STACK ON MOBILE ===== */
@media (max-width:768px){
 .layout{
  flex-direction:column;
  align-items:center;
 }
 .side{
  width:100%;
  max-width:520px;
 }
}

/* ===== CRITICAL MOBILE FIX (restores old behavior) ===== */
@media (max-width:520px){
 :root{
  --tile:24px;
  --gap:4px;
 }

 h1{ font-size:32px; }
 .sub{ font-size:15px; }
 .tile{ font-size:13px; }
}
</style>
</head>

<body>
<div class="wrap">

<h1 id="themeTitle">Daily Word Search</h1>

<p class="sub">
Tap letters in a straight line (up, down, left, right, or diagonal), then tap <b>Check</b>.
</p>

<div class="layout">
<div id="grid" class="grid"></div>

<aside class="side">
<h2>Find these words</h2>

<div id="chips" class="chips"></div>

<div class="controls">
<button id="checkBtn" class="primary">Check</button>
<button id="clearBtn" class="secondary">Clear</button>
</div>

<div id="status" class="status"></div>
</aside>
</div>
</div>

<script>

/* ===== GRID SIZE ===== */
const COLS = 14;
const ROWS = 11;


/* ======================================================
   21 DAILY THEMES
====================================================== */
const THEMES = [

{ name:"Valentine’s Day", words:["HEART","ROSES","CANDY","CARDS","FLOWERS","KISSES","CUPID","LOVE","DATE","CHOCOLATE"] },

{ name:"The Solar System", words:["MERCURY","VENUS","EARTH","MARS","JUPITER","SATURN","URANUS","NEPTUNE","COMET","ASTEROID"] },

{ name:"Man’s Best Friend", words:["LABRADOR","POODLE","BEAGLE","TERRIER","COLLIE","HUSKY","RETRIEVER","KENNEL","LEASH","PAWS"] },

{ name:"The Cat’s Meow", words:["KITTEN","WHISKERS","TAIL","PAWS","PURRING","SCRATCH","LITTER","MEOW","NAP","FELINE"] },

{ name:"Vacation Vibes", words:["SUNSCREEN","BEACH","HOTEL","CAMERA","RELAX","TOWEL","SANDALS","BOARDWALK","POOL","SUITCASE"] },

{ name:"Cruise Control", words:["SHIP","CABIN","DECK","ANCHOR","PORT","OCEAN","SAIL","BUFFET","CAPTAIN","HARBOR"] },

{ name:"Hot Dog Toppings", words:["MUSTARD","KETCHUP","RELISH","ONIONS","CHILI","CHEESE","SAUERKRAUT","BACON","PICKLES","SLAW"] },

{ name:"The Eyes Have It", words:["IRIS","PUPIL","LENSES","VISION","BLINK","EYELASH","FOCUS","GLASSES","RETINA","OPTIC"] },

{ name:"Parts of an Airplane", words:["WING","COCKPIT","ENGINE","LANDING","FLAPS","TAIL","RUNWAY","CABIN","PILOT","ALTITUDE"] },

{ name:"Heard at Night", words:["CRICKETS","OWL","WIND","THUNDER","WHISTLE","SNORE","BREEZE","FROGS","RAIN","ECHO"] },

{ name:"Black and White", words:["ZEBRA","PANDA","CHESS","OREO","TUXEDO","NEWSPAPER","PENGUIN","SKUNK","DALMATIAN","MAGPIE"] },

{ name:"Things That Melt", words:["ICE","BUTTER","CHEESE","CANDLE","WAX","CHOCOLATE","SNOW","MARSHMALLOW","SOAP","GLUE"] },

{ name:"Found on the Seashore", words:["SHELLS","STARFISH","DRIFTWOOD","CRAB","SEAWEED","SAND","PEBBLES","SEAGULL","TIDE","ANCHOR"] },

{ name:"Salty Snacks", words:["PRETZEL","CHIPS","POPCORN","NUTS","CRACKERS","PICKLES","FRIES","BACON","JERKY","CHEX"] },

{ name:"They Came In Pairs", words:["SOCKS","GLOVES","SHOES","MITTENS","EARRINGS","TWINS","BATTERIES","CHOPSTICKS","SKATES","SLEEVES"] },

{ name:"Pasta, Baby!", words:["SPAGHETTI","LASAGNA","RAVIOLI","PENNE","ZITI","FETTUCCINE","MACARONI","SAUCE","MEATBALL","GARLIC"] },

{ name:"Packing List", words:["SUITCASE","PASSPORT","TOOTHBRUSH","SHOES","CHARGER","JACKET","MAP","BOOK","HAT","CAMERA"] },

{ name:"Disney Villains", words:["URSULA","SCAR","JAFAR","MALEFICENT","CRUELLA","HADES","HOOK","GASTON","SHAN","EVILQUEEN"] },

{ name:"Office Supplies", words:["PAPER","STAPLER","PENS","CLIPS","FOLDER","SCISSORS","TAPE","PRINTER","MARKER","BINDER"] },

{ name:"Farm Animals", words:["COW","PIG","HORSE","CHICKEN","SHEEP","GOAT","DONKEY","ROOSTER","BARN","TRACTOR"] },

{ name:"Going Up or Down?", words:["ELEVATOR","STAIRS","ESCALATOR","LADDER","LIFT","SLIDE","HILL","RAMP","ROPE","BALLOON"] }

];


/* ===== DATE ROTATION ===== */
function easternISO(){
 return new Date().toLocaleDateString("en-CA",{timeZone:"America/New_York"});
}
function dayIndexFromISO(iso){
 const [y,m,d]=iso.split("-").map(Number);
 return Math.floor(Date.UTC(y,m-1,d)/86400000);
}

const TODAY = easternISO();
const dayIndex = dayIndexFromISO(TODAY);
const theme = THEMES[dayIndex % THEMES.length];
const WORDS = theme.words;

document.getElementById("themeTitle").textContent = theme.name;
document.title = theme.name + " Word Search";


/* ===== ORIGINAL GAME LOGIC (UNCHANGED) ===== */

function xmur3(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return()=>{h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);return(h^=h>>>16)>>>0;}}
function mulberry32(a){return()=>{let t=a+=0x6D2B79F5;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}}

const seedFn = xmur3(TODAY);
let rand = mulberry32(seedFn());
const rInt = n => Math.floor(rand()*n);

const DIRS=[{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1},{dx:1,dy:1},{dx:-1,dy:-1},{dx:1,dy:-1},{dx:-1,dy:1}];
const inB=(x,y)=>x>=0&&x<COLS&&y>=0&&y<ROWS;

function canPlace(g,w,x0,y0,d){
 for(let i=0;i<w.length;i++){
  const x=x0+d.dx*i,y=y0+d.dy*i;
  if(!inB(x,y)||g[y][x]&&g[y][x]!==w[i])return false;
 }
 return true;
}

function placeWord(g,w){
 for(let t=0;t<2000;t++){
  const d=DIRS[rInt(DIRS.length)],x=rInt(COLS),y=rInt(ROWS);
  if(!canPlace(g,w,x,y,d))continue;
  for(let i=0;i<w.length;i++)g[y+d.dy*i][x+d.dx*i]=w[i];
  return;
 }
}

function generate(words){
 const g=Array.from({length:ROWS},()=>Array(COLS).fill(""));
 words.sort((a,b)=>b.length-a.length).forEach(w=>placeWord(g,w));
 const fill="EAIONRSTLUAENRSTL";
 for(let y=0;y<ROWS;y++)
  for(let x=0;x<COLS;x++)
   if(!g[y][x])g[y][x]=fill[rInt(fill.length)];
 return g;
}

const gridData=generate(WORDS);
const grid=document.getElementById("grid");
const chips=document.getElementById("chips");
const status=document.getElementById("status");

grid.style.gridTemplateColumns=`repeat(${COLS}, var(--tile))`;

gridData.forEach((r,y)=>r.forEach((l,x)=>{
 const d=document.createElement("div");
 d.className="tile";
 d.textContent=l;
 d.onclick=()=>tap(x,y,d);
 grid.appendChild(d);
}));

WORDS.forEach(w=>{
 const c=document.createElement("div");
 c.className="chip";
 c.textContent=w;
 c.id="w-"+w;
 chips.appendChild(c);
});

status.textContent=`Found 0 of ${WORDS.length}`;

let sel=[],dir=null,found=new Set();

function step(a,b){
 const dx=b.x-a.x,dy=b.y-a.y;
 if(Math.abs(dx)>1||Math.abs(dy)>1||(!dx&&!dy))return null;
 return{dx:Math.sign(dx),dy:Math.sign(dy)};
}

function tap(x,y,e){
 if(sel.some(s=>s.x===x&&s.y===y))return;
 if(!sel.length){sel=[{x,y,e}];e.classList.add("sel");return;}
 if(sel.length===1){dir=step(sel[0],{x,y});if(!dir)return;}
 else{const s=step(sel[sel.length-1],{x,y});if(!s||s.dx!==dir.dx||s.dy!==dir.dy)return;}
 sel.push({x,y,e});
 e.classList.add("sel");
}

document.getElementById("checkBtn").onclick=()=>{
 const word=sel.map(s=>gridData[s.y][s.x]).join("");
 const rev=word.split("").reverse().join("");
 const hit=WORDS.find(w=>!found.has(w)&&(w===word||w===rev));
 if(!hit)return;
 found.add(hit);
 sel.forEach(s=>s.e.classList.add("found"));
 document.getElementById("w-"+hit).classList.add("found");
 status.textContent=`Found ${found.size} of ${WORDS.length}`;
 sel=[];dir=null;
};

document.getElementById("clearBtn").onclick=()=>{
 sel.forEach(s=>s.e.classList.remove("sel"));
 sel=[];dir=null;
};

</script>
</body>
</html>
