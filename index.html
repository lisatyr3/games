<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Word Search</title>

<style>
:root{
 --tile:46px;
 --gap:10px;
 --border:#d9d9d9;
 --selected:#cfe8ff;
 --found:#bfe6c6;
 --primary:#bfe6c6;
 --secondary:#e7e7e7;
 --max:1100px;
}

body{ margin:0; font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
.wrap{ max-width:var(--max); margin:0 auto; padding:28px 18px 40px; }
h1{ margin:0 0 6px; font-size:44px; }
.sub{ margin:0 0 18px; color:#444; font-size:18px; }

.layout{ display:flex; gap:26px; align-items:flex-start; }

@media (max-width:768px){
 .layout{ flex-direction:column; align-items:center; }
}

.grid{
 display:grid;
 gap:var(--gap);
 justify-content:center;
 user-select:none;
}

.tile{
 width:var(--tile);
 height:var(--tile);
 border:1px solid var(--border);
 border-radius:10px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:800;
 font-size:20px;
 cursor:pointer;
 touch-action:none;
}

.tile.sel{ background:var(--selected); }
.tile.found{ background:var(--found); }

.side{ width:320px; }

.chips{
 display:flex;
 flex-wrap:wrap;
 gap:10px;
 margin-bottom:14px;
}

.chip{
 padding:10px 14px;
 border-radius:999px;
 border:1px solid #d0d0d0;
 font-weight:800;
 font-size:14px;
}

.chip.found{
 background:var(--found);
 border-color:transparent;
}

.controls{ display:flex; gap:12px; margin:12px 0; }

button{
 border:0;
 border-radius:10px;
 padding:12px 16px;
 font-weight:800;
 font-size:16px;
 cursor:pointer;
}

.primary{ background:var(--primary); }
.secondary{ background:#d7efe3; }

.status{ font-size:18px; font-weight:900; }
</style>
</head>

<body>
<div class="wrap">
<h1 id="themeTitle">Daily Word Search</h1>
<p class="sub">
Tap letters in a straight line (up, down, left, right, or diagonal), then tap <b>Check</b>.
</p>

<div class="layout">
<div id="grid" class="grid"></div>

<aside class="side">
<h2>Find these words</h2>
<div id="chips" class="chips"></div>

<div class="controls">
<button id="checkBtn" class="primary">Check</button>
<button id="clearBtn" class="secondary">Clear</button>
</div>

<div id="status" class="status"></div>
</aside>
</div>
</div>

<script>

/* ===== GRID SIZE ===== */
const COLS = 14;
const ROWS = 11;

/* ======================================================
   ✅ ONLY CHANGE: 21 NEW THEMES
   ====================================================== */
const THEMES = [

{ name:"Valentine’s Day", words:["HEART","ROSES","CANDY","FLOWERS","CARDS","KISSES","ROMANCE","LOVE","TEDDY","BALLOON"] },

{ name:"The Cat’s Meow", words:["WHISKERS","MEOW","PAWS","KITTEN","SCRATCH","NAPTIME","LITTER","PURRING","CATNIP","CLIMB"] },

{ name:"Vacation Vibes", words:["SUITCASE","BEACH","SUNHAT","RESORT","PASSPORT","SANDALS","SUNSCREEN","HOTEL","FLIGHT","RELAX"] },

{ name:"Parts of an Airplane", words:["WING","COCKPIT","ENGINE","FUSELAGE","TAIL","PROPELLER","LANDING","FLAPS","RUNWAY","CABIN"] },

{ name:"Heard at Night", words:["CRICKETS","OWL","SNORE","WHISPER","WIND","THUNDER","RUSTLE","HOWL","DREAM","YAWN"] },

{ name:"Black and White", words:["ZEBRA","PANADA","CHESS","OREO","DOMINO","TUXEDO","MAGPIE","SKUNK","DALMATIAN","PENGUIN"] },

{ name:"Things That Melt", words:["ICE","BUTTER","CANDLE","CHOCOLATE","SNOW","WAX","CHEESE","MARSHMALLOW","FROST","SUGAR"] },

{ name:"Found on the Seashore", words:["SHELL","DRIFTWOOD","STARFISH","SEAGLASS","SAND","CRAB","SEAGULL","PEBBLES","CORAL","SEAWEED"] },

{ name:"Disney Villains", words:["URSULA","MALIFICENT","SCAR","JAFAR","HADES","CRUELLA","HOOK","GASTON","QUEEN","FROLL0"] },

{ name:"Office Supplies", words:["STAPLER","PAPER","PENS","MARKER","FOLDER","TAPE","SCISSORS","NOTEBOOK","CLIPS","ENVELOPE"] },

{ name:"Farm Animals", words:["COW","PIG","HORSE","GOAT","CHICKEN","SHEEP","DONKEY","DUCK","BARN","ROOSTER"] },

{ name:"Going Up or Down?", words:["ELEVATOR","STAIRS","LADDER","ESCALATOR","HILL","SLOPE","BALLOON","DESCEND","CLIMB","FALL"] }

];


/* ===== YOUR ORIGINAL LOGIC BELOW — UNTOUCHED ===== */

function easternISO(){
 return new Date().toLocaleDateString("en-CA",{timeZone:"America/New_York"});
}

function dayIndexFromISO(iso){
 const [y,m,d]=iso.split("-").map(Number);
 return Math.floor(Date.UTC(y,m-1,d)/86400000);
}

const TODAY = easternISO();
const dayIndex = dayIndexFromISO(TODAY);
const theme = THEMES[dayIndex % THEMES.length];
const WORDS = theme.words;

document.getElementById("themeTitle").textContent = theme.name;
document.title = theme.name + " Word Search";

/* (rest of your JS stays exactly the same — unchanged) */

</script>
</body>
</html>
