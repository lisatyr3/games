<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daily Word Search</title>

<style>
:root{
  --size: 32px;
  --gap: 4px;
}

body{
  margin:0;
  font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  text-align:center;
  background:#fff;
}

h2{
  margin:12px 0 6px;
}

#grid{
  display:grid;
  gap:var(--gap);
  justify-content:center;
  margin:14px auto;
  touch-action:manipulation;
}

.cell{
  width:var(--size);
  height:var(--size);
  border:1px solid #ccc;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  user-select:none;
  background:#fff;
  font-size:16px;
}

.cell.selected{
  background:#a6dad2;
}

#words{
  max-width:500px;
  margin:10px auto 18px;
  font-size:.95rem;
  line-height:1.5;
}
</style>
</head>

<body>

<h2 id="theme"></h2>
<div id="grid"></div>
<div id="words"></div>

<script>
/* =========================
   GRID SETTINGS (UNCHANGED)
========================= */
const COLS = 14;
const ROWS = 11;

/* =========================
   DAILY THEME ROTATION
========================= */
function easternDayIndex(){
  const now = new Date();

  const utc = now.getTime() + (now.getTimezoneOffset()*60000);
  const est = new Date(utc + (-5*3600000)); // fixed Eastern

  const midnight = new Date(est.getFullYear(), est.getMonth(), est.getDate());
  const base = new Date(2025,0,1);

  return Math.floor((midnight-base)/(24*60*60*1000));
}

/* =========================
   THEMES (NEW LITERARY WEEK)
========================= */

const themes = [

{
name:"Pride and Prejudice",
words:[
"bennet","darcy","elizabeth","jane","bingley","lydia",
"wickham","longbourn","pemberley","proposal","marriage","estate"
]},

{
name:"Sense and Sensibility",
words:[
"dashwood","elinor","marianne","edward","brandon","willoughby",
"lucy","norland","barton","letters","romance","family"
]},

{
name:"Emma",
words:[
"emma","woodhouse","knightley","harriet","elton","fairfax",
"churchill","highbury","picnic","ballroom","friendship","match"
]},

{
name:"Wuthering Heights",
words:[
"catherine","heathcliff","hindley","edgar","isabella","nelly",
"moors","storm","revenge","grange","ghostly","passion"
]},

{
name:"Jane Eyre",
words:[
"jane","rochester","thornefield","adele","bertha","rivers",
"lowood","governess","attic","mystery","inheritance","fire"
]},

{
name:"Middlemarch",
words:[
"dorothea","lislaw","casaubon","rosamond","lydgate","bulstrode",
"vincy","brooke","reform","society","townlife","politics"
]},

{
name:"North and South",
words:[
"margaret","hale","thornton","milton","cotton","milltown",
"strike","factory","workers","industry","change","family"
]}

];


/* =========================
   PICK TODAY'S THEME
========================= */
const today = easternDayIndex();
const theme = themes[today % themes.length];

document.getElementById("theme").textContent = theme.name;


/* =========================
   BUILD GRID (UNCHANGED)
========================= */

const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const grid = [];
for(let r=0;r<ROWS;r++){
  grid[r]=[];
  for(let c=0;c<COLS;c++){
    grid[r][c]=letters[Math.floor(Math.random()*26)];
  }
}

/* place words horizontally only (simple + stable) */
theme.words.forEach(word=>{
  const w = word.toUpperCase();
  const row = Math.floor(Math.random()*ROWS);
  const maxStart = COLS - w.length;
  if(maxStart<0) return;

  const col = Math.floor(Math.random()*maxStart);
  for(let i=0;i<w.length;i++){
    grid[row][col+i]=w[i];
  }
});


/* =========================
   RENDER GRID
========================= */
const gridEl = document.getElementById("grid");
gridEl.style.gridTemplateColumns = `repeat(${COLS}, var(--size))`;

for(let r=0;r<ROWS;r++){
  for(let c=0;c<COLS;c++){
    const div=document.createElement("div");
    div.className="cell";
    div.textContent=grid[r][c];

    div.onclick=()=>div.classList.toggle("selected");

    gridEl.appendChild(div);
  }
}

/* =========================
   WORD LIST DISPLAY
========================= */
document.getElementById("words").textContent =
  theme.words.join(" • ").toUpperCase();

</script>

</body>
</html>
