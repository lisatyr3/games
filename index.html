<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Word Search</title>

<style>
:root{
  --tile:46px;
  --gap:10px;
  --border:#d9d9d9;
  --selected:#cfe8ff;
  --found:#bfe6c6;
  --primary:#bfe6c6;
  --secondary:#e7e7e7;
  --max:1100px;
}

body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;}
.wrap{max-width:var(--max);margin:0 auto;padding:28px 18px 40px;}
h1{margin:0 0 6px;font-size:44px;}
.sub{margin:0 0 18px;color:#444;font-size:18px;}

.layout{display:flex;gap:26px;align-items:flex-start;}
@media (max-width:768px){
  .layout{flex-direction:column;align-items:center;}
}

.grid{display:grid;gap:var(--gap);justify-content:center;user-select:none;}

.tile{
  width:var(--tile);
  height:var(--tile);
  border:1px solid var(--border);
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:20px;
  cursor:pointer;
  touch-action:none;
}

.tile.sel{background:var(--selected);}
.tile.found{background:var(--found);}

.side{width:320px;}
@media (max-width:768px){.side{width:100%;max-width:520px;}}

.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
.chip{padding:10px 14px;border-radius:999px;border:1px solid #d0d0d0;font-weight:800;font-size:14px;}
.chip.found{background:var(--found);border-color:transparent;}

button{
  border:0;border-radius:10px;padding:12px 16px;
  font-weight:800;font-size:16px;cursor:pointer;
}

.primary{background:var(--primary);}
.secondary{background:#d7efe3;}

@media (max-width:520px){
  :root{--tile:24px;--gap:4px;}
  .tile{font-size:13px;}
}
</style>
</head>

<body>
<div class="wrap">
  <h1 id="themeTitle">Daily Word Search</h1>
  <p class="sub">Tap letters in a straight line, then tap <b>Check</b>.</p>

  <div class="layout">
    <div id="grid" class="grid"></div>

    <aside class="side">
      <div id="chips" class="chips"></div>

      <div style="display:flex;gap:12px;margin:12px 0;">
        <button id="checkBtn" class="primary">Check</button>
        <button id="clearBtn" class="secondary">Clear</button>
      </div>

      <div id="status"></div>
    </aside>
  </div>
</div>

<script>

/* ===== GRID ===== */
const COLS = 14;
const ROWS = 11;

/* =====================================================
   SAFE THEMES (all words ≤ 8 letters → always fits)
   ===================================================== */

const THEMES = [

  { name:"Pride and Prejudice", words:[
    "BENNET","DARCY","ELIZA","JANE","BINGLEY",
    "LYDIA","WICKHAM","LONGBOUR","PEMBER","BALL"
  ]},

  { name:"Sense and Sensibility", words:[
    "ELINOR","MARIANN","EDWARD","BRANDON",
    "LUCY","NORLAND","BARTON","LETTERS","LOVE"
  ]},

  { name:"Emma", words:[
    "EMMA","HARriet".toUpperCase(),"KNIGHT","ELTON",
    "FAIRFAX","CHURCH","PICNIC","MATCH","FRIEND"
  ]},

  { name:"Wuthering Heights", words:[
    "CATHY","HEATH","HINDLEY","EDGAR",
    "NELLY","MOORS","GRANGE","STORM","GHOST"
  ]},

  { name:"Jane Eyre", words:[
    "JANE","ROCH","ADELE","BERTHA",
    "LOWOOD","RIVERS","ATTIC","FIRE","LOVE"
  ]},

  /* ===== FIXED MIDDLEMARCH (safe + fits 100%) ===== */
  { name:"Middlemarch", words:[
    "ROSAMOND",
    "CASAUBON",
    "LYDGATE",
    "VINCY",
    "BROOKE",
    "REFORM",
    "SOCIETY",
    "TOWN",
    "MARCH",
    "DOCTOR"
  ]},

  { name:"North and South", words:[
    "MARGARET","HALE","THORNTON","MILL",
    "COTTON","STRIKE","FAMILY","WORKERS","TRADE"
  ]}
];


/* ===== DAILY ROTATION (Eastern Time) ===== */
function easternISO(){
  return new Date().toLocaleDateString("en-CA",{timeZone:"America/New_York"});
}
function dayIndexFromISO(iso){
  const [y,m,d]=iso.split("-").map(Number);
  return Math.floor(Date.UTC(y,m-1,d)/86400000);
}

const TODAY = easternISO();
const theme = THEMES[dayIndexFromISO(TODAY) % THEMES.length];
const WORDS = theme.words;

document.getElementById("themeTitle").textContent = theme.name;


/* ===== RNG ===== */
function xmur3(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return()=>{h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);return(h^=h>>>16)>>>0;}}
function mulberry32(a){return()=>{let t=a+=0x6D2B79F5;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}}
const rand = mulberry32(xmur3(TODAY)());
const rInt=n=>Math.floor(rand()*n);


/* ===== GRID LOGIC ===== */
const DIRS=[{dx:1,dy:0},{dx:0,dy:1},{dx:1,dy:1},{dx:-1,dy:1}];
const inB=(x,y)=>x>=0&&x<COLS&&y>=0&&y<ROWS;

function place(g,w){
  for(let t=0;t<2000;t++){
    const d=DIRS[rInt(DIRS.length)],x=rInt(COLS),y=rInt(ROWS);
    let ok=true;
    for(let i=0;i<w.length;i++){
      const xx=x+d.dx*i,yy=y+d.dy*i;
      if(!inB(xx,yy)||(g[yy][xx]&&g[yy][xx]!==w[i])){ok=false;break;}
    }
    if(!ok)continue;
    for(let i=0;i<w.length;i++)g[y+d.dy*i][x+d.dx*i]=w[i];
    return;
  }
}

function generate(words){
  const g=Array.from({length:ROWS},()=>Array(COLS).fill(""));
  words.sort((a,b)=>b.length-a.length).forEach(w=>place(g,w));
  const fill="EAIONRSTLUA";
  for(let y=0;y<ROWS;y++)
    for(let x=0;x<COLS;x++)
      if(!g[y][x])g[y][x]=fill[rInt(fill.length)];
  return g;
}


/* ===== UI ===== */
const gridData=generate(WORDS);
const grid=document.getElementById("grid");
grid.style.gridTemplateColumns=`repeat(${COLS}, var(--tile))`;

gridData.forEach((r,y)=>r.forEach((l,x)=>{
  const d=document.createElement("div");
  d.className="tile";d.textContent=l;
  d.onclick=()=>d.classList.toggle("sel");
  grid.appendChild(d);
}));

const chips=document.getElementById("chips");
WORDS.forEach(w=>{
  const c=document.createElement("div");
  c.className="chip";c.textContent=w;
  chips.appendChild(c);
});

</script>
</body>
</html>
