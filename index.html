<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Word Search</title>

<style>
:root{
 --tile:46px;
 --gap:10px;
 --border:#d9d9d9;
 --selected:#cfe8ff;
 --found:#bfe6c6;
 --primary:#bfe6c6;
 --secondary:#e7e7e7;
 --max:1100px;
}

body{
 margin:0;
 font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}

.wrap{
 max-width:var(--max);
 margin:0 auto;
 padding:28px 18px 40px;
}

h1{ margin:0 0 6px; font-size:44px; }
.sub{ margin:0 0 18px; color:#444; font-size:18px; }

/* =============================
   DESKTOP LAYOUT
============================= */
.layout{
 display:flex;
 gap:26px;
 align-items:flex-start;
}

.side{
 width:320px;
 flex-shrink:0;
}

/* =============================
   MOBILE FIX (THE IMPORTANT PART)
   We SWITCH TO BLOCK LAYOUT
============================= */
@media (max-width: 768px){

 .layout{
   display:block;   /* <<< this is the magic */
 }

 .grid{
   margin-bottom:25px;
 }

 .side{
   width:100%;
   max-width:none;
 }
}

/* =============================
   GRID
============================= */
.grid{
 display:grid;
 gap:var(--gap);
 justify-content:center;
 user-select:none;
}

.tile{
 width:var(--tile);
 height:var(--tile);
 border:1px solid var(--border);
 border-radius:10px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:800;
 font-size:20px;
 cursor:pointer;
}

.tile.sel{ background:var(--selected); }
.tile.found{ background:var(--found); }

/* =============================
   WORD LIST
============================= */
.chips{
 display:flex;
 flex-wrap:wrap;
 gap:10px;
 margin-bottom:14px;
}

.chip{
 padding:10px 14px;
 border-radius:999px;
 border:1px solid #d0d0d0;
 font-weight:800;
 font-size:14px;
}

.chip.found{
 background:var(--found);
 border-color:transparent;
}

/* =============================
   CONTROLS
============================= */
.controls{ display:flex; gap:12px; margin:12px 0; }

button{
 border:0;
 border-radius:10px;
 padding:12px 16px;
 font-weight:800;
 font-size:16px;
 cursor:pointer;
}

.primary{ background:var(--primary); }
.secondary{ background:#d7efe3; }

.status{ font-size:18px; font-weight:900; }

/* =============================
   SMALL PHONES – shrink tiles only
============================= */
@media (max-width:520px){
 :root{
  --tile:24px;
  --gap:4px;
 }

 .tile{ font-size:13px; }
}
</style>
</head>

<body>
<div class="wrap">

<h1 id="themeTitle">Daily Word Search</h1>
<p class="sub">
Tap letters in a straight line (up, down, left, right, or diagonal), then tap <b>Check</b>.
</p>

<div class="layout">

<div id="grid" class="grid"></div>

<aside class="side">
<h2>Find these words</h2>
<div id="chips" class="chips"></div>

<div class="controls">
<button id="checkBtn" class="primary">Check</button>
<button id="clearBtn" class="secondary">Clear</button>
</div>

<div id="status" class="status"></div>
</aside>

</div>
</div>

<script>

</body>
</html>
